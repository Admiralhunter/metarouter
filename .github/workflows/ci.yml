name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    # Keep the legacy main/develop checks. They reference a tests/ suite that
    # is absent on master, where the Docker build and API smoke gate run.
    if: github.ref_name != 'master' && github.base_ref != 'master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Check formatting with black
        run: |
          black --check src tests

      - name: Type check with mypy
        continue-on-error: true  # Don't fail on type errors initially
        run: |
          pip install mypy
          mypy src || true

      - name: Run tests
        run: |
          pytest tests/ -v

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t metarouter:test .

      - name: Verify package import and health endpoint in the image
        run: |
          docker run --rm --network none metarouter:test python -c "from fastapi.testclient import TestClient; from metarouter.main import app; response = TestClient(app).get('/health'); assert response.status_code == 200 and response.json() == {'status': 'healthy'}, response.text"
